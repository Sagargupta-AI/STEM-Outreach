{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}<section class="auth-wrap"><form class="panel auth" method="post"><span class="eyebrow">WELCOME BACK</span><h1>Log in</h1><p class="muted">Open the project dashboard and survey results.</p><label>Email address<input type="email" name="email" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn full" type="submit">Log in</button><p class="muted center">New here? <a href="{{ url_for('register') }}">Create an account</a></p></form></section>{% endblock %}
