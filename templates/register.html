{% extends "base.html" %}{% block title %}Create account{% endblock %}
{% block content %}<section class="auth-wrap"><form class="panel auth" method="post"><span class="eyebrow">GET STARTED</span><h1>Create account</h1><p class="muted">Register to view survey analysis and export responses.</p><label>Full name<input name="name" required autocomplete="name" maxlength="80"></label><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" minlength="8" required autocomplete="new-password"><small>Use at least 8 characters.</small></label><button class="btn full" type="submit">Create account</button><p class="muted center">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></form></section>{% endblock %}
